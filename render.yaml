services:
  # 1. Main Web Application & API Service
  - type: web
    name: itrex-platform
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: itrex-postgres
          property: connectionString

databases:
  # 2. Managed PostgreSQL Cloud Database on Render
  - name: itrex-postgres
    plan: free
    databaseName: itrex_db
    user: itrex_admin
